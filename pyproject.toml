[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumina"
version = "1.1.1"
description = "LuminaCode - a local MCP-driven coding agent powered by DeepSeek V4 Flash"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
webview = ["pywebview>=4.0"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
lumina = "lumina.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["lumina"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# typer's idiom requires Option/Argument calls in defaults
"lumina/cli.py" = ["B008"]
